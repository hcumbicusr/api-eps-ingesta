services:
  api-eps-ingesta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_eps_ingesta
    env_file: .env
    ports:
      - "${INGESTA_PORT}:${INGESTA_PORT}"
    depends_on:
      - rabbitmq-eps-broker
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - eps_network

networks:
  eps_network:
    driver: bridge